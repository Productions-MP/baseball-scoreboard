<main class="scoreboard-display scoreboard-display-football-v1" data-template-id="football-clock-v1">
  <section class="football-board">
    <div class="football-board-status">
      <span class="heartbeat-led" id="heartbeat-led" aria-label="Websocket connection status"></span>
    </div>

    <div class="football-team-block football-team-guest">
      <div class="football-team-label" id="football-guest-team-label">GUEST</div>
      <div class="football-team-score" id="football-guest-score">0</div>
    </div>

    <div class="football-center-block">
      <div class="football-quarter" id="football-quarter">Q1</div>
      <div class="football-clock" id="football-clock">12:00</div>
    </div>

    <div class="football-team-block football-team-home">
      <div class="football-team-label" id="football-home-team-label">HOME</div>
      <div class="football-team-score" id="football-home-score">0</div>
    </div>
  </section>
</main>

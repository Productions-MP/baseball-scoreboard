<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ScoreHLS Display</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body
    class="display-page"
    style="--scorehls-template-width: {{ active_template.width }}px; --scorehls-template-height: {{ active_template.height }}px;"
  >
    <div class="display-shell">
      <div class="display-screensaver" id="display-screensaver" hidden aria-hidden="true">
        <div class="display-screensaver-x">
          <div class="display-screensaver-y">
            <img
              class="display-screensaver-logo"
              src="{{ url_for('public_asset', filename='hls.png') }}"
              alt="{{ school_name }} logo"
            >
          </div>
        </div>
      </div>
      <div class="display-frame" id="display-frame">
        {% include display_template %}
      </div>
    </div>

    <script>
      window.SCOREHLS_CONFIG = {
        requireKey: false,
        defaultSportId: {{ default_sport_id | tojson }},
        activeTemplate: {{ active_template | tojson }},
        sports: {{ sports | tojson }},
        initialState: {{ initial_state | tojson }},
        screensaverIdleSeconds: {{ screensaver_idle_seconds | tojson }},
        blackoutIdleSeconds: {{ blackout_idle_seconds | tojson }},
        endpoints: {
          getState: "/api/state",
          updateState: "/api/state",
          resetState: "/api/reset",
          websocket: "/ws"
        }
      };
    </script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script src="{{ url_for('static', filename='display.js') }}"></script>
  </body>
</html>
